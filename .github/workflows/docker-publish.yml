# Publica las imágenes de py-app y react-app en dos registros a la vez:
#   - GHCR      (ghcr.io)   -> no necesita configurar nada, usa el GITHUB_TOKEN del repo
#   - Docker Hub (docker.io) -> necesita las credenciales cargadas en el repo (ver README)
#
# Se buildea UNA sola vez por servicio y se pushea a ambos registros,
# porque los tags de los dos registros apuntan al mismo build.
name: Docker Publish

on:
  push:
    branches:
      - feature/docker

# Permisos mínimos: leer el código y escribir paquetes (GHCR).
permissions:
  contents: read
  packages: write

# Si se pushea dos veces seguidas, cancela el build viejo.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Una imagen por servicio: el patrón estándar en un monorepo.
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: py-app
            context: ./py-app
          - service: react-app
            context: ./react-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docker Hub es opcional: si no están cargadas las credenciales,
      # el workflow igual publica en GHCR en vez de fallar.
      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub deshabilitado (faltan vars.DOCKERHUB_USERNAME o secrets.DOCKERHUB_TOKEN). Se publica solo en GHCR."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Genera nombres, tags y labels OCI siguiendo la convención estándar:
      #   <registry>/<namespace>/<repository>:<tag>
      #
      #   GHCR       -> ghcr.io/<owner>/<repo>/<servicio>       (soporta namespaces anidados)
      #   Docker Hub -> docker.io/<usuario>/<repo>-<servicio>   (no soporta anidados: se usa "-")
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=ghcr.io/${{ github.repository }}/${{ matrix.service }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}-${{ matrix.service }},enable=${{ steps.dockerhub.outputs.enabled == 'true' }}
          tags: |
            # Tag inmutable por commit: el único que sirve para deployar/rollbackear.
            type=sha,prefix=sha-,format=short
            # Tag por rama: "feature-docker". Se mueve en cada push, sirve para probar.
            type=ref,event=branch
            # Si algún día se taggea el repo (v1.2.3) -> 1.2.3, 1.2 y 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # "latest" solo en la rama default, y es un puntero móvil: nunca deployar por latest.
            type=raw,value=latest,enable={{is_default_branch}}
          # Labels OCI estándar: quedan embebidos en la imagen (docker inspect)
          # y permiten trazar de qué commit y repo salió.
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=${{ matrix.service }} de clases-ing-soft
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Multi-arquitectura (ej. Macs con Apple Silicon). Duplica el tiempo de build:
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          # Cache de capas entre corridas: evita reinstalar dependencias en cada push.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Summary
        run: |
          {
            echo "### Imágenes publicadas: \`${{ matrix.service }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
